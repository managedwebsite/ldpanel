<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Good Mobile — Панель</title><style>
:root{--bg:#06100b;--card:#0d1912;--line:#1e3a28;--text:#f3fff6;--muted:#91aa99;--gold:#42e879;--orange:#20c76a;--red:#ff6178;--blue:#69e89a;--green:#31dc74}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#123d24,transparent 40%),var(--bg);color:var(--text);font:15px system-ui,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}header{height:72px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#07120cdd;backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:900}.brand b{color:var(--gold)}.mini{display:flex;align-items:center;gap:10px}.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--orange));color:#18110a;font-weight:900;object-fit:cover}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 72px)}aside{padding:16px;border-right:1px solid var(--line)}nav{display:grid;gap:7px;position:sticky;top:88px}nav button{border:0;background:transparent;color:var(--muted);padding:13px;border-radius:12px;text-align:left;display:flex;align-items:center;gap:10px}.ico{width:19px;height:19px;flex:0 0 19px}nav button:hover,nav button.on{background:#12321f;color:#fff}main{padding:26px;max-width:1400px;width:100%;margin:auto}.hero,.card{background:linear-gradient(135deg,#102018,#0b1510);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 18px 50px #0004}.hero{margin-bottom:18px}.hero h1{font-size:clamp(30px,5vw,48px);margin:0 0 8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{font-size:34px;font-weight:900}.people{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.person{position:relative}.top{display:flex;align-items:center;gap:12px}.role{color:var(--gold);font-weight:800;font-size:13px}.frac{color:var(--muted);font-size:13px}.dots{position:absolute;right:14px;top:14px;background:#173323;color:#fff;border:0;border-radius:10px;width:38px;height:38px;font-size:22px}.warn{display:grid;gap:3px;padding:10px 12px;border:1px solid #245337;background:#0b1b11;border-radius:13px}.warn strong{color:#baffcc}.warn small{color:var(--muted)}.warn-actions{display:flex;gap:8px;justify-content:flex-end}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#192534;color:var(--blue);font-size:12px;font-weight:800}.list{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0b1710;border:1px solid var(--line);border-radius:14px;padding:14px}.primary{background:linear-gradient(135deg,var(--green),var(--orange));border:0;color:#171108;font-weight:900;padding:11px 17px;border-radius:12px}.ghost{background:#12321f;border:0;color:#fff;padding:10px 14px;border-radius:10px}.danger{background:#32151d;border:0;color:#ff9aad;padding:10px 14px;border-radius:10px}.form{display:grid;gap:11px}.form input,.form textarea,.form select{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#08130d;color:#fff;outline:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.modal-head h3{margin:0 0 5px}.closex{border:0;background:#12321f;color:#dfffe8;width:38px;height:38px;border-radius:12px;font-size:24px}.select-wrap{display:grid;gap:7px}.select-wrap label{font-size:12px;color:var(--muted);font-weight:700}.modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(7px);display:grid;place-items:center;padding:16px;z-index:50}.box{width:min(560px,100%);max-height:90vh;overflow:auto;background:#0d1912;border:1px solid #285038;border-radius:22px;padding:22px;animation:pop .18s ease}@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);padding:28px;border-radius:24px;background:#0d1912;border:1px solid var(--line)}.logo{text-align:center;font-size:38px;font-weight:1000}.logo b{color:var(--gold)}.toast{position:fixed;right:16px;bottom:16px;background:#12321f;border:1px solid var(--line);padding:12px 16px;border-radius:12px;z-index:100}.section{margin-top:22px}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{padding:8px;border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;overflow:auto;top:0}nav button{white-space:nowrap}.grid,.people{grid-template-columns:1fr}main{padding:14px}.who{display:none}.two{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div><script>
const $=x=>document.querySelector(x), esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let S={u:null,c:null,p:[],n:[],e:[],t:[],r:[],a:[],tab:'home'};
async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Ошибка');return d}function toast(t){let x=$('#toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2200)}function ava(u){return u.avatar?`<img class="ava" src="${esc(u.avatar)}">`:`<div class="ava">${esc((u.name||u.login||'?')[0].toUpperCase())}</div>`}
async function load(){try{S.u=(await api('/api/me')).user}catch{return login()}S.c=await api('/api/config');await refresh();render()}async function refresh(){S.p=await api('/api/people');S.n=await api('/api/news');S.e=await api('/api/events');S.t=await api('/api/tasks');S.r=await api('/api/norms');if(S.u.type==='admin')S.a=await api('/api/admins')}
function login(){document.querySelector('#app').innerHTML=`<div class="login"><div class="loginbox"><div class="logo">Good <b>Mobile</b></div><p class="muted">Панель лидеров, заместителей и администрации</p><form class="form" onsubmit="doLogin(event)"><input id="l" placeholder="Логин" required><input id="pw" type="password" placeholder="Пароль" required><button class="primary">Войти</button></form><p class="muted" style="font-size:12px">Первый администратор создаётся через ADMIN_LOGIN / ADMIN_PASSWORD в Railway.</p></div></div>`}async function doLogin(e){e.preventDefault();try{S.u=(await api('/api/login',{method:'POST',body:JSON.stringify({login:$('#l').value,password:$('#pw').value})})).user;S.c=await api('/api/config');await refresh();render()}catch(x){toast(x.message)}}
function ico(n){const p={home:'M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-5v6H4.5A1.5 1.5 0 0 1 3 19.5v-9',people:'M16 21v-2a4 4 0 0 0-8 0v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M19 8a3 3 0 0 1 0 6M21 21v-2a4 4 0 0 0-3-3.87',events:'M4 5h16v14H4zM8 3v4M16 3v4M4 10h16',news:'M5 4h14v16H5zM8 8h8M8 12h8M8 16h5',tasks:'M5 4h14v16H5zM8 9l2 2 4-4M8 15h7',norms:'M4 5h16v14H4zM8 9h8M8 13h8M8 17h5',profile:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M5 21a7 7 0 0 1 14 0',admin:'M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.8 1.8-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.04 1.56V22h-2.55v-.1a1.7 1.7 0 0 0-1.04-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.8-1.8.06-.06A1.7 1.7 0 0 0 8.1 17a1.7 1.7 0 0 0-1.56-1.04H6.4v-2.55h.1A1.7 1.7 0 0 0 8.06 12.4a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.8-1.8.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.04-1.56V7h2.55v.1a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.8 1.8-.06.06A1.7 1.7 0 0 0 19.4 12a1.7 1.7 0 0 0 1.56 1.04h.1v2.55h-.1A1.7 1.7 0 0 0 19.4 15z'};return `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${p[n]||p.home}"/></svg>`}function header(){return `<header><div class="brand">Good <b>Mobile</b></div><div class="mini">${ava(S.u)}<span class="who">${esc(S.u.name||S.u.login)} · ${esc(S.u.role)}</span><button class="ghost" onclick="logout()">Выйти</button></div></header>`}function side(){let ns=[['home','Главная'],['people','Лидеры'],['events','МП'],['news','Новости'],['tasks','Задания'],['norms','Нормы'],['profile','Профиль']];if(S.u.type==='admin')ns.push(['admin','Админ-панель']);return `<aside><nav>${ns.map(n=>`<button class="${S.tab===n[0]?'on':''}" onclick="go('${n[0]}')">${ico(n[0])}<span>${n[1]}</span></button>`).join('')}</nav></aside>`}function render(){document.querySelector('#app').innerHTML=header()+`<div class="layout">${side()}<main id="main"></main></div>`;draw()}function go(t){S.tab=t;render()}async function logout(){await api('/api/logout',{method:'POST'});S.u=null;login()}
function draw(){let m=$('#main');m.innerHTML={home:home,people:people,events:events,news:news,tasks:tasks,norms:norms,profile:profile,admin:adminPage}[S.tab]()}function home(){return `<div class="hero"><h1>Добро пожаловать, ${esc(S.u.name||S.u.login)}</h1><p class="muted">Единый центр управления Good Mobile: состав, МП, новости, задания, нормы и администрирование.</p></div><div class="grid"><div class="card"><div class="muted">Лидеры</div><div class="stat">${S.p.length}</div></div><div class="card"><div class="muted">МП</div><div class="stat">${S.e.length}</div></div><div class="card"><div class="muted">Задания</div><div class="stat">${S.t.length}</div></div></div><div class="section"><h2>Последние новости</h2>${S.n.slice(0,3).map(n=>`<div class="card" style="margin:10px 0"><b>${esc(n.title)}</b><p class="muted">${esc(n.text)}</p></div>`).join('')}</div>`}
function people(){return `<div class="hero"><h1>Лидеры и заместители</h1><p class="muted">Все действующие руководители фракций.</p></div><div class="people">${S.p.map(u=>`<div class="card person">${S.u.type==='admin'?`<button class="dots" onclick="pm('${u.id}')">⋮</button>`:''}<div class="top">${ava(u)}<div><b>${esc(u.name||u.login)}</b><div class="role">${esc(u.role)}</div><div class="frac">${esc(u.fraction)}</div></div></div><p><span class="tag">Выговоры: ${(u.warningList||[]).length}</span></p></div>`).join('')||'<div class="card empty">Нет аккаунтов лидеров.</div>'}</div>`}
function events(){return `<div class="hero"><h1>Мероприятия</h1><p class="muted">МП проекта и их проведение.</p>${S.u.type==='admin'||S.u.type==='leader'?'<button class="primary" onclick="em()">+ Создать МП</button>':''}</div><div class="list">${S.e.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.description||'')} · ${esc(x.date||'')}</div></div>${S.u.type==='admin'?`<button class="danger" onclick="del('/api/events/${x.id}')">Удалить</button>`:''}</div>`).join('')||'<div class="empty">МП пока нет.</div>'}</div>`}function news(){return `<div class="hero"><h1>Новости</h1><p class="muted">Официальная лента проекта.</p>${S.u.type==='admin'?'<button class="primary" onclick="nm()">+ Новость</button>':''}</div><div class="list">${S.n.map(x=>`<div class="card"><div class="role">${new Date(x.date).toLocaleString()}</div><h3>${esc(x.title)}</h3><p class="muted">${esc(x.text)}</p><span class="tag">${esc(x.author)}</span>${S.u.type==='admin'?` <button class="danger" onclick="del('/api/news/${x.id}')">Удалить</button>`:''}</div>`).join('')}</div>`}function tasks(){return `<div class="hero"><h1>Задания</h1><p class="muted">Контроль задач по фракциям.</p>${S.u.type==='admin'?'<button class="primary" onclick="tm()">+ Создать</button>':''}</div><div class="list">${S.t.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.description||'')} · ${esc(x.fraction||'Все')}</div></div><span class="tag">${esc(x.status)}</span></div>`).join('')||'<div class="empty">Заданий нет.</div>'}</div>`}function norms(){return `<div class="hero"><h1>Нормы</h1><p class="muted">Нормативы и требования.</p>${S.u.type==='admin'?'<button class="primary" onclick="rm()">+ Добавить</button>':''}</div><div class="list">${S.r.map(x=>`<div class="card"><span class="tag">${esc(x.fraction||'Все')}</span><h3>${esc(x.title)}</h3><p class="muted">${esc(x.text)}</p>${S.u.type==='admin'?`<button class="danger" onclick="del('/api/norms/${x.id}')">Удалить</button>`:''}</div>`).join('')||'<div class="empty">Нормы не добавлены.</div>'}</div>`}
function profile(){return `<div class="hero"><h1>Профиль</h1><p class="muted">Ник, логин и аватар.</p></div><div class="card"><div class="top">${ava(S.u)}<div><b>${esc(S.u.name||S.u.login)}</b><div class="role">${esc(S.u.role)}</div><div class="frac">${esc(S.u.fraction||'Администрация')}</div></div></div><form class="form" style="margin-top:20px" onsubmit="saveProfile(event)"><input id="pn" value="${esc(S.u.name||'')}" placeholder="Ник"><input id="pl" value="${esc(S.u.login)}" placeholder="Логин"><input id="pa" type="file" accept="image/*"><button class="primary">Сохранить</button></form></div>`}
function adminPage(){return `<div class="hero"><h1>Админ-панель</h1><p class="muted">Управление аккаунтами, блокировками, выговорами, фракциями и назначениями.</p><button class="primary" onclick="am()">+ Создать администратора</button> <button class="ghost" onclick="lm()">+ Создать лидера</button></div><div class="grid"><div class="card"><div class="muted">Админы</div><div class="stat">${S.a.length}</div></div><div class="card"><div class="muted">Лидеры</div><div class="stat">${S.p.length}</div></div><div class="card"><div class="muted">Выговоры</div><div class="stat">${S.p.reduce((a,x)=>a+((x.warningList||[]).length),0)}</div></div></div><div class="section"><h2>Лидеры</h2><div class="list">${S.p.map(u=>`<div class="row"><div><b>${esc(u.name||u.login)}</b><div class="muted">${esc(u.role)} · ${esc(u.fraction)} · ${(u.warningList||[]).length} выгов.</div></div><button class="ghost" onclick="pm('${u.id}')">Управление ⋮</button></div>`).join('')}</div></div><div class="section"><h2>Администраторы</h2><div class="list">${S.a.map(u=>`<div class="row"><div><b>${esc(u.name||u.login)}</b><div class="muted">${esc(u.role)}</div></div>${u.id===S.u.id?'':`<button class="danger" onclick="ra('${u.id}')">Удалить</button>`}</div>`).join('')}</div></div>`}
function modal(h){$('#modal').innerHTML=`<div class="box">${h}</div>`;$('#modal').classList.remove('hidden')}function close(){ $('#modal').classList.add('hidden') }function sel(a){return a.map(x=>`<option>${esc(x)}</option>`).join('')}
function pm(id){let u=S.p.find(x=>x.id===id),ws=u.warningList||[];modal(`<div class="modal-head"><div><h3>Управление: ${esc(u.name||u.login)}</h3><p class="muted">${esc(u.role)} · ${esc(u.fraction)}</p></div><button class="closex" onclick="close()">×</button></div><div class="list"><button class="ghost" onclick="act('${id}','block')">Заблокировать</button><button class="primary" onclick="warningForm('${id}')">Выдать выговор</button><button class="ghost" onclick="fm('${id}')">Изменить фракцию</button><button class="ghost" onclick="lm2('${id}')">Назначить лидером</button><button class="ghost" onclick="am2('${id}')">Назначить админом</button><button class="danger" onclick="act('${id}','fire')">Уволить</button></div><div class="section"><h4>Выговоры (${ws.length})</h4>${ws.length?ws.map((w,i)=>`<div class="warn"><strong>${esc(w.type)}</strong><span>${esc(w.reason)}</span><small>${new Date(w.date).toLocaleString()} · ${esc(w.issuedBy||'Система')}</small><div class="warn-actions"><button class="ghost" onclick="removeWarning('${id}','${w.id}')">Снять выговор</button></div></div>`).join(''):'<div class="empty">Выговоров нет.</div>'}<button class="ghost" onclick="close()">Закрыть</button></div>`)}function warningForm(id){modal(`<div class="modal-head"><div><h3>Выдать выговор</h3><p class="muted">Укажите причину и тип взыскания.</p></div><button class="closex" onclick="close()">×</button></div><form class="form" onsubmit="issueWarning(event,'${id}')"><textarea id="wr" rows="5" placeholder="Причина выговора" required></textarea><div class="select-wrap"><label>Тип выговора</label><select id="wt"><option>Письменный</option><option>Устный</option></select></div><div class="two"><button class="ghost" type="button" onclick="close()">Закрыть</button><button class="primary">Выдать</button></div></form>`)}async function issueWarning(e,id){e.preventDefault();await act(id,'warning',{reason:$('#wr').value,warningType:$('#wt').value})}async function removeWarning(id,wid){if(!confirm('Снять этот выговор?'))return;await act(id,'removeWarning',{warningId:wid})}
async function act(id,action,x={}){try{await api('/api/admin/people/'+id,{method:'PATCH',body:JSON.stringify({action,...x})});close();await refresh();render();toast('Готово')}catch(e){toast(e.message)}}function fm(id){modal(`<h3>Изменить фракцию</h3><div class="form"><select id="f">${sel(S.c.fractions)}</select><button class="primary" onclick="act('${id}','setFraction',{fraction:$('#f').value})">Сохранить</button></div>`)}function lm2(id){modal(`<h3>Назначить лидером</h3><div class="form"><select id="lr">${sel(S.c.leaderRoles)}</select><select id="lf">${sel(S.c.fractions)}</select><button class="primary" onclick="act('${id}','setLeader',{role:$('#lr').value,fraction:$('#lf').value})">Назначить</button></div>`)}function am2(id){modal(`<h3>Назначить админом</h3><div class="form"><select id="ar">${sel(S.c.adminRoles)}</select><button class="primary" onclick="act('${id}','setAdmin',{role:$('#ar').value})">Назначить</button></div>`)}
function am(){modal(`<h3>Создать администратора</h3><form class="form" onsubmit="ca(event)"><input id="al" placeholder="Ник (логин)" required><input id="ap" type="password" placeholder="Пароль" required><select id="ar">${sel(S.c.adminRoles)}</select><button class="primary">Создать</button></form>`)}async function ca(e){e.preventDefault();try{await api('/api/admin/users',{method:'POST',body:JSON.stringify({login:$('#al').value,password:$('#ap').value,role:$('#ar').value})});close();await refresh();render();toast('Администратор создан')}catch(x){toast(x.message)}}function lm(){modal(`<h3>Создать аккаунт лидера / заместителя</h3><form class="form"><input id="ll" placeholder="Ник (логин)" required><input id="lp" type="password" placeholder="Пароль" required><select id="lf">${sel(S.c.fractions)}</select><select id="lr">${sel(S.c.leaderRoles)}</select><button class="primary" type="button" onclick="cl()">Создать</button></form>`)}async function cl(){try{await api('/api/leader/users',{method:'POST',body:JSON.stringify({login:$('#ll').value,password:$('#lp').value,fraction:$('#lf').value,role:$('#lr').value})});close();await refresh();render();toast('Аккаунт создан')}catch(x){toast(x.message)}}function nm(){modal(`<h3>Новая новость</h3><form class="form"><input id="nt" placeholder="Заголовок"><textarea id="nx" rows="5" placeholder="Текст"></textarea><button class="primary" type="button" onclick="cn()">Опубликовать</button></form>`)}async function cn(){try{await api('/api/news',{method:'POST',body:JSON.stringify({title:$('#nt').value,text:$('#nx').value})});close();await refresh();draw();toast('Опубликовано')}catch(x){toast(x.message)}}function em(){modal(`<h3>Создать МП</h3><form class="form"><input id="et" placeholder="Название"><input id="ed" placeholder="Дата и время"><textarea id="ex" rows="4" placeholder="Описание"></textarea><button class="primary" type="button" onclick="ce()">Создать</button></form>`)}async function ce(){try{await api('/api/events',{method:'POST',body:JSON.stringify({title:$('#et').value,date:$('#ed').value,description:$('#ex').value})});close();await refresh();draw();toast('МП создано')}catch(x){toast(x.message)}}function tm(){modal(`<h3>Новое задание</h3><form class="form"><input id="tt" placeholder="Название"><textarea id="tx" rows="4" placeholder="Описание"></textarea><select id="tf"><option value="">Все фракции</option>${sel(S.c.fractions)}</select><input id="td" placeholder="Дедлайн"><button class="primary" type="button" onclick="ct()">Создать</button></form>`)}async function ct(){try{await api('/api/tasks',{method:'POST',body:JSON.stringify({title:$('#tt').value,description:$('#tx').value,fraction:$('#tf').value,deadline:$('#td').value})});close();await refresh();draw();toast('Задание создано')}catch(x){toast(x.message)}}function rm(){modal(`<h3>Добавить норму</h3><form class="form"><input id="rt" placeholder="Название"><textarea id="rx" rows="5" placeholder="Описание"></textarea><select id="rf"><option value="">Все фракции</option>${sel(S.c.fractions)}</select><button class="primary" type="button" onclick="cr()">Добавить</button></form>`)}async function cr(){try{await api('/api/norms',{method:'POST',body:JSON.stringify({title:$('#rt').value,text:$('#rx').value,fraction:$('#rf').value})});close();await refresh();draw();toast('Норма добавлена')}catch(x){toast(x.message)}}async function del(u){if(!confirm('Удалить?'))return;try{await api(u,{method:'DELETE'});await refresh();draw();toast('Удалено')}catch(x){toast(x.message)}}async function ra(id){if(!confirm('Удалить администратора?'))return;try{await api('/api/admin/users/'+id,{method:'DELETE'});await refresh();draw();toast('Удалён')}catch(x){toast(x.message)}}async function saveProfile(e){e.preventDefault();try{let d={name:$('#pn').value,login:$('#pl').value},f=$('#pa').files[0];if(f){if(f.size>1500000)throw Error('Аватар максимум 1.5 МБ');d.avatar=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}S.u=(await api('/api/profile',{method:'PUT',body:JSON.stringify(d)})).user;await refresh();render();toast('Профиль сохранён')}catch(x){toast(x.message)}}load();</script></body></html>
